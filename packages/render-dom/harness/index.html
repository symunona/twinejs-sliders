<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>render-dom harness</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #e8ecf5;
				--dim: #8c96ad;
				--panel: #161a24;
				--edge: #2a3040;
				--accent: #7a6cff;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				gap: 14px;
				padding: 18px;
				background: #0b0d13;
				color: var(--ink);
				font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
			}

			header {
				display: flex;
				align-items: baseline;
				gap: 12px;
				flex-wrap: wrap;
			}

			h1 {
				margin: 0;
				font-size: 16px;
				font-weight: 650;
				letter-spacing: 0.01em;
			}

			header p {
				margin: 0;
				color: var(--dim);
			}

			/* The host element, exactly as the twinejs preview passes it in: fixed aspect,
			   position relative, renderer letterboxes itself inside. */
			.scene-stage {
				position: relative;
				width: 100%;
				max-width: 1100px;
				aspect-ratio: 16 / 9;
				border: 1px solid var(--edge);
				border-radius: 10px;
				overflow: hidden;
			}

			.controls {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
				max-width: 1100px;
			}

			button {
				padding: 7px 14px;
				border: 1px solid var(--edge);
				border-radius: 7px;
				background: var(--panel);
				color: var(--ink);
				font: inherit;
				font-weight: 550;
				cursor: pointer;
			}

			button:hover {
				border-color: var(--accent);
			}

			button:disabled {
				opacity: 0.4;
				cursor: default;
			}

			button[aria-pressed='true'] {
				border-color: var(--accent);
				background: #23204a;
			}

			.spacer {
				flex: 1;
			}

			#label {
				font-weight: 650;
			}

			#status {
				max-width: 1100px;
				min-height: 1.5em;
				color: var(--dim);
			}

			#status b {
				color: var(--accent);
			}

			kbd {
				padding: 1px 5px;
				border: 1px solid var(--edge);
				border-radius: 4px;
				background: var(--panel);
				font: inherit;
				font-size: 0.85em;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>render-dom harness</h1>
			<p>
				Three hardcoded stages, stub assets, no Twine. <kbd>&larr;</kbd>
				<kbd>&rarr;</kbd> to step.
			</p>
		</header>

		<div class="scene-stage" id="stage"></div>

		<div class="controls">
			<button id="prev" type="button">&larr; Prev</button>
			<button id="next" type="button">Next &rarr;</button>
			<button id="replay" type="button">Replay</button>
			<span id="label">1 / 3</span>
			<span class="spacer"></span>
			<button id="guides" type="button" aria-pressed="false">Guides</button>
			<button id="snap" type="button" aria-pressed="false">Snap (no transitions)</button>
		</div>

		<p id="status"></p>

		<script type="module" src="./main.ts"></script>
	</body>
</html>
